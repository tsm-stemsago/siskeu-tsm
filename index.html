<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keuangan TSM SMK Negeri 1 Gombong</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Google Material Symbols (Icons) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <!-- 3. Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 4. React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 5. Babel (Untuk menerjemahkan React JSX di browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 6. Firebase SDK (Versi Compat untuk HTML murni) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    
    <!-- Container Aplikasi -->
    <div id="root">
        <div class="min-h-screen flex items-center justify-center text-slate-500">
            Memuat Sistem Keuangan TSM...
        </div>
    </div>

    <!-- Logika Aplikasi React -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- KONFIGURASI FIREBASE ANDA ---
        const firebaseConfig = {
            apiKey: "AIzaSyDnc4NAinWZ3dy7o8Qe3syLcrOmxtyVFqI",
            authDomain: "siskeu-tsm-gombong.firebaseapp.com",
            projectId: "siskeu-tsm-gombong",
            storageBucket: "siskeu-tsm-gombong.firebasestorage.app",
            messagingSenderId: "95232448815",
            appId: "1:95232448815:web:999b0b0cb5f133dc34e9da",
            measurementId: "G-2QCD4GET18"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- FUNGSI BANTUAN ---
        const formatIDR = (amount) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        const generateId = () => Math.random().toString(36).substring(2, 15);
        const generateNum = (prefix) => `${prefix}-${new Date().getTime().toString().slice(-6)}`;

        // --- KOMPONEN UI ---
        const Icon = ({ name, size = 20, className = "" }) => (
            <span className={`material-symbols-outlined ${className}`} style={{ fontSize: size }}>{name}</span>
        );

        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-3xl shadow-sm border border-slate-100 p-6 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ onClick, children, variant = 'primary', className = '', type = 'button', disabled = false }) => {
            const base = "px-5 py-2.5 rounded-full font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 hover:shadow-md",
                secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200",
                danger: "bg-red-50 text-red-700 hover:bg-red-100",
                success: "bg-green-50 text-green-700 hover:bg-green-100",
                outline: "border-2 border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = 'text', value, onChange, required = false, disabled = false, min, name }) => (
            <div className="flex flex-col gap-1.5 w-full">
                <label className="text-sm font-medium text-slate-700">{label} {required && <span className="text-red-500">*</span>}</label>
                <input 
                    type={type} value={value} onChange={onChange} required={required} disabled={disabled} min={min} name={name}
                    className="w-full rounded-2xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50 transition-all" 
                />
            </div>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-[2rem] w-full max-w-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="px-8 py-5 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="text-xl font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors">
                                <Icon name="close" />
                            </button>
                        </div>
                        <div className="p-8 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- APLIKASI UTAMA ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            
            // UI State
            const [currentView, setCurrentView] = useState('dashboard');
            // Ubah inisialisasi agar sidebar otomatis tertutup jika dibuka di HP (lebar layar < 1024px)
            const [isSidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 1024);
            const [notification, setNotification] = useState(null);

            // Data State
            const [kasTxs, setKasTxs] = useState([]);
            const [loans, setLoans] = useState([]);
            const [products, setProducts] = useState([]);
            const [workOrders, setWorkOrders] = useState([]);

            const notify = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 4000);
            };

            // 1. AUTHENTICATION & RBAC
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        const unsubProfile = db.collection('users').doc(currentUser.uid).onSnapshot(docSnap => {
                            if (docSnap.exists) {
                                const data = docSnap.data();
                                // Blokir login jika akun tidak aktif
                                if(data.isActive === false) {
                                    auth.signOut();
                                    notify('Akun Anda telah dinonaktifkan.', 'error');
                                    return;
                                }
                                setProfile(data);
                            } else {
                                setProfile({ uid: currentUser.uid, name: currentUser.email || 'User', role: 'PENDING', isActive: true });
                            }
                        });
                        setAuthLoading(false);
                        return () => unsubProfile();
                    } else {
                        setProfile(null);
                        setAuthLoading(false);
                    }
                });
                return () => unsubscribe();
            }, []);

            // 2. REALTIME DATA FETCHING (Berdasarkan Role)
            useEffect(() => {
                if (!profile || profile.role === 'PENDING') return;

                const unsubs = [];
                
                if (profile.role === 'ADMIN' || profile.role === 'BENDAHARA_KAS') {
                    unsubs.push(db.collection('kasTransactions').orderBy('date', 'desc').onSnapshot(snap => {
                        setKasTxs(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    }, err => console.error("Kas Read Error:", err)));
                }
                
                if (profile.role === 'ADMIN' || profile.role === 'BENDAHARA_UP') {
                    unsubs.push(db.collection('upWorkOrders').orderBy('date', 'desc').onSnapshot(snap => {
                        setWorkOrders(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    }, err => console.error("UP Read Error:", err)));
                }

                return () => unsubs.forEach(unsub => unsub());
            }, [profile]);

            // --- FINANCIAL ENGINE (CALCULATIONS) ---
            const financials = useMemo(() => {
                let kasBalance = 0, kasIn = 0, kasOut = 0;
                let upKasBalance = 0, upReceivables = 0, upRevenue = 0;

                kasTxs.forEach(tx => {
                    if (tx.type === 'INCOME') { kasIn += tx.amount; kasBalance += tx.amount; }
                    if (tx.type === 'EXPENSE') { kasOut += tx.amount; kasBalance -= tx.amount; }
                });

                workOrders.forEach(wo => {
                    upKasBalance += wo.paidAmount || 0;
                    
                    if (wo.status === 'DONE' || wo.status === 'DELIVERED') {
                        upRevenue += wo.totalAmount;
                        upReceivables += (wo.totalAmount - (wo.paidAmount || 0));
                    }
                });

                return { 
                    kasBalance, kasIn, kasOut,
                    upKasBalance, upRevenue, upReceivables
                };
            }, [kasTxs, workOrders]);


            // --- VIEW: LOGIN ---
            if (authLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50">Memuat Sistem...</div>;
            
            if (!user) {
                const handleLogin = async (e) => {
                    e.preventDefault();
                    try { 
                        await auth.signInWithEmailAndPassword(e.target.email.value, e.target.password.value); 
                    } catch (err) { 
                        let errorMsg = 'Gagal login. Periksa email & sandi.';
                        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                            errorMsg = 'Email atau Password salah, atau belum terdaftar di sistem.';
                        } else if (err.code === 'auth/operation-not-allowed') {
                            errorMsg = 'Metode login Email/Password belum diaktifkan di Firebase Console!';
                        }
                        notify(errorMsg, 'error'); 
                    }
                };

                const handleResetPassword = async () => {
                    const emailField = document.querySelector('input[name="email"]');
                    const emailInput = emailField ? emailField.value : '';
                    
                    if (!emailInput) {
                        notify('Silakan isi kolom Email terlebih dahulu untuk mereset password.', 'error');
                        return;
                    }
                    
                    try {
                        await auth.sendPasswordResetEmail(emailInput);
                        notify('Tautan reset password telah dikirim ke email Anda.', 'success');
                    } catch (err) {
                        let errorMsg = 'Gagal mengirim email reset.';
                        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-email') {
                            errorMsg = 'Email tidak valid atau belum terdaftar.';
                        }
                        notify(errorMsg, 'error');
                    }
                };

                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4">
                        <Card className="w-full max-w-md">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-black text-slate-800 tracking-tight">SISKEU<span className="text-blue-600">TSM</span></h1>
                                <p className="text-slate-500 mt-2">Masuk ke sistem manajemen keuangan</p>
                            </div>
                            {notification && <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-xl text-center font-medium">{notification.msg}</div>}
                            <form onSubmit={handleLogin} className="space-y-5">
                                <Input label="Email" type="email" name="email" required />
                                <Input label="Password" type="password" name="password" required />
                                <Button type="submit" className="w-full py-3">Masuk ke Sistem</Button>
                            </form>
                            <div className="mt-6 text-center text-sm">
                                <button type="button" onClick={handleResetPassword} className="text-blue-600 hover:text-blue-800 hover:underline font-medium transition-colors">
                                    Lupa Password?
                                </button>
                            </div>
                        </Card>
                    </div>
                );
            }

            // --- VIEW: MENUNGGU OTORISASI ---
            if (profile?.role === 'PENDING') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-4">
                        <Card className="max-w-md text-center flex flex-col items-center">
                            <Icon name="error" size={64} className="text-orange-500 mb-4" />
                            <h2 className="text-xl font-bold text-slate-800 mb-2">Menunggu Otorisasi</h2>
                            <p className="text-slate-600 mb-6">Akun Anda belum diberikan hak akses oleh Administrator. Silakan hubungi Admin Sekolah.</p>
                            <Button variant="outline" onClick={() => auth.signOut()}>Keluar</Button>
                        </Card>
                    </div>
                );
            }

            // --- SUB-VIEWS ---
            const ViewDashboard = () => (
                <div className="space-y-6">
                    <div className="flex justify-between items-end mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Dashboard Utama</h2>
                            <p className="text-slate-500">Ringkasan keuangan terintegrasi</p>
                        </div>
                    </div>

                    {(profile?.role === 'ADMIN' || profile?.role === 'BENDAHARA_KAS') && (
                        <div className="space-y-4">
                            <h3 className="font-semibold text-slate-700 flex items-center gap-2"><Icon name="account_balance_wallet" size={18}/> Kinerja Kas Jurusan</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <Card className="bg-gradient-to-br from-blue-600 to-blue-800 text-white border-none">
                                    <p className="text-blue-100 text-sm font-medium mb-1">Saldo Kas Tersedia</p>
                                    <h3 className="text-3xl font-bold">{formatIDR(financials.kasBalance)}</h3>
                                </Card>
                                <Card>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Total Pemasukan</p>
                                    <h3 className="text-xl font-bold text-green-600">{formatIDR(financials.kasIn)}</h3>
                                </Card>
                                <Card>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Total Pengeluaran</p>
                                    <h3 className="text-xl font-bold text-red-600">{formatIDR(financials.kasOut)}</h3>
                                </Card>
                            </div>
                        </div>
                    )}

                    {(profile?.role === 'ADMIN' || profile?.role === 'BENDAHARA_UP') && (
                        <div className="space-y-4 pt-4 border-t border-slate-200">
                            <h3 className="font-semibold text-slate-700 flex items-center gap-2"><Icon name="build" size={18}/> Kinerja Unit Produksi Bengkel</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <Card className="bg-gradient-to-br from-emerald-600 to-emerald-800 text-white border-none">
                                    <p className="text-emerald-100 text-sm font-medium mb-1">Total Pendapatan (WO)</p>
                                    <h3 className="text-2xl font-bold">{formatIDR(financials.upRevenue)}</h3>
                                </Card>
                                <Card>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Penerimaan Kas UP</p>
                                    <h3 className="text-xl font-bold text-slate-800">{formatIDR(financials.upKasBalance)}</h3>
                                </Card>
                                <Card>
                                    <p className="text-slate-500 text-sm font-medium mb-1">Piutang Pelanggan (WO Selesai)</p>
                                    <h3 className="text-xl font-bold text-red-600">{formatIDR(financials.upReceivables)}</h3>
                                </Card>
                            </div>
                        </div>
                    )}
                </div>
            );

            const ViewKas = () => {
                const [isFormOpen, setIsFormOpen] = useState(false);
                const [txType, setTxType] = useState('INCOME');
                const [form, setForm] = useState({ description: '', amount: '', borrower: '', date: new Date().toISOString().split('T')[0] });

                // Menghitung running balance (saldo berjalan)
                const kasTxsWithBalance = useMemo(() => {
                    const sorted = [...kasTxs].sort((a, b) => a.date - b.date);
                    let currentBalance = 0;
                    const withBalance = sorted.map(tx => {
                        if (tx.type === 'INCOME' || tx.type === 'LOAN_PAYMENT') currentBalance += tx.amount;
                        else currentBalance -= tx.amount;
                        return { ...tx, balance: currentBalance };
                    });
                    return withBalance.reverse();
                }, [kasTxs]);

                const handleSaveTx = async (e) => {
                    e.preventDefault();
                    const amount = parseInt(form.amount);
                    if (amount <= 0) return notify('Nominal harus lebih dari 0', 'error');

                    const batch = db.batch();
                    const txId = generateId();
                    const journalId = generateId();
                    
                    let desc = form.description;
                    let accountName = 'Pemasukan Kas';

                    if (txType === 'EXPENSE') {
                        accountName = 'Beban Kas';
                    } else if (txType === 'LOAN') {
                        desc = `Pencairan Pinjaman: ${form.borrower} - ${form.description}`;
                        accountName = 'Piutang Pinjaman';
                    } else if (txType === 'LOAN_PAYMENT') {
                        desc = `Pengembalian Pinjaman: ${form.borrower} - ${form.description}`;
                        accountName = 'Penerimaan Pengembalian Pinjaman';
                    }

                    const txDate = form.date ? new Date(form.date).getTime() : Date.now();

                    const tx = {
                        id: txId, txNumber: generateNum('KAS'), date: txDate, 
                        type: (txType === 'EXPENSE' || txType === 'LOAN') ? 'EXPENSE' : 'INCOME', 
                        category: txType, description: desc, 
                        amount, createdBy: user.uid
                    };
                    batch.set(db.collection('kasTransactions').doc(txId), tx);

                    const journal = {
                        id: journalId, date: txDate, module: 'KAS', referenceId: txId,
                        description: desc, createdBy: user.uid,
                        account: accountName,
                        debit: (txType === 'INCOME' || txType === 'LOAN_PAYMENT') ? amount : 0,
                        credit: (txType === 'EXPENSE' || txType === 'LOAN') ? amount : 0
                    };
                    batch.set(db.collection('journalEntries').doc(journalId), journal);

                    try {
                        await batch.commit();
                        setIsFormOpen(false); 
                        setForm({description:'', amount:'', borrower:'', date: new Date().toISOString().split('T')[0]});
                        notify('Berhasil mencatat transaksi kas');
                    } catch (e) { notify('Gagal menyimpan. Cek Otorisasi/Validasi.', 'error'); }
                };

                return (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center">
                            <h2 className="text-2xl font-bold text-slate-800">Manajemen Kas Jurusan</h2>
                        </div>

                        <Card className="p-0 overflow-hidden">
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                <h3 className="font-bold text-slate-700">Riwayat Transaksi</h3>
                                <Button onClick={() => setIsFormOpen(true)}><Icon name="add" size={16} /> Tambah Transaksi</Button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 text-slate-500">
                                        <tr><th className="p-4">Tanggal</th><th className="p-4">No. Ref</th><th className="p-4">Keterangan</th><th className="p-4 text-right">Nominal</th><th className="p-4 text-right">Saldo</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {kasTxsWithBalance.map(tx => {
                                            const isPlus = tx.type === 'INCOME';
                                            return (
                                                <tr key={tx.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="p-4 text-slate-600">{new Date(tx.date).toLocaleDateString('id-ID')}</td>
                                                    <td className="p-4 font-mono text-xs text-slate-400">{tx.txNumber}</td>
                                                    <td className="p-4 font-medium text-slate-800">{tx.description}</td>
                                                    <td className={`p-4 text-right font-bold ${isPlus ? 'text-green-600' : 'text-red-600'}`}>
                                                        {isPlus ? '+' : '-'}{formatIDR(tx.amount)}
                                                    </td>
                                                    <td className="p-4 text-right font-bold text-slate-700">
                                                        {formatIDR(tx.balance)}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {kasTxs.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-500">Belum ada transaksi</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </Card>

                        <Modal isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title="Tambah Data Transaksi Kas">
                            <form onSubmit={handleSaveTx} className="space-y-4">
                                <div className="flex flex-col gap-1.5 w-full">
                                    <label className="text-sm font-medium text-slate-700">Jenis Transaksi <span className="text-red-500">*</span></label>
                                    <select 
                                        value={txType} 
                                        onChange={(e) => setTxType(e.target.value)}
                                        className="w-full rounded-2xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                                    >
                                        <option value="INCOME">Pemasukan</option>
                                        <option value="EXPENSE">Pengeluaran</option>
                                        <option value="LOAN">Pinjaman (Kas Keluar)</option>
                                        <option value="LOAN_PAYMENT">Pengembalian Pinjaman (Kas Masuk)</option>
                                    </select>
                                </div>

                                <Input label="Tanggal Transaksi" type="date" required value={form.date} onChange={(e)=>setForm({...form, date: e.target.value})} />

                                {(txType === 'LOAN' || txType === 'LOAN_PAYMENT') && (
                                    <Input label="Nama Peminjam / Pemberi" required value={form.borrower} onChange={(e)=>setForm({...form, borrower: e.target.value})} placeholder="Contoh: Budi (Guru)" />
                                )}

                                <Input label="Keterangan / Keperluan" required value={form.description} onChange={(e)=>setForm({...form, description: e.target.value})} placeholder="Deskripsi transaksi..." />
                                <Input label="Nominal (Rp)" type="number" min="1" required value={form.amount} onChange={(e)=>setForm({...form, amount: e.target.value})} />
                                
                                <div className="pt-6 flex justify-end gap-3">
                                    <Button variant="secondary" onClick={()=>setIsFormOpen(false)}>Batal</Button>
                                    <Button type="submit">Simpan Transaksi</Button>
                                </div>
                            </form>
                        </Modal>
                    </div>
                );
            };

            const ViewUnitProduksi = () => {
                const [isWOForm, setIsWOForm] = useState(false);
                const [isPayForm, setIsPayForm] = useState(null);
                const [payAmount, setPayAmount] = useState('');
                const [detailWO, setDetailWO] = useState(null);
                
                const [woForm, setWoForm] = useState({ customerName: '', vehiclePlate: '', complaint: '' });
                const [woItems, setWoItems] = useState([]);
                const [newItem, setNewItem] = useState({ type: 'JASA', name: '', price: '', qty: '1' });

                const handleAddItem = () => {
                    if(!newItem.name || !newItem.price || !newItem.qty) return;
                    setWoItems([...woItems, { 
                        id: generateId(), type: newItem.type, name: newItem.name, 
                        price: parseInt(newItem.price), qty: parseInt(newItem.qty) 
                    }]);
                    setNewItem({ type: 'JASA', name: '', price: '', qty: '1' });
                };

                const handleRemoveItem = (id) => setWoItems(woItems.filter(item => item.id !== id));

                const handleSaveWO = async (e) => {
                    e.preventDefault();
                    if (woItems.length === 0) return notify('Tambahkan minimal 1 pekerjaan/sparepart', 'error');
                    
                    const total = woItems.reduce((acc, item) => acc + (item.price * item.qty), 0);

                    const wo = {
                        id: generateId(), woNumber: generateNum('WO'), date: Date.now(),
                        customerName: woForm.customerName, vehiclePlate: woForm.vehiclePlate, complaint: woForm.complaint,
                        items: woItems, totalAmount: total, paidAmount: 0, status: 'WAITING'
                    };
                    
                    try {
                        await db.collection('upWorkOrders').doc(wo.id).set(wo);

                    const journal = {
                        id: journalId, date: Date.now(), module: 'UP', referenceId: wo.id,
                        description: `Penyelesaian WO ${wo.woNumber}`, createdBy: user.uid,
                        account: 'Piutang Pelanggan', debit: wo.totalAmount, credit: 0
                    };
                    batch.set(db.collection('journalEntries').doc(journalId), journal);

                        notify('WO Selesai, Tagihan diterbitkan.');

                                    <p>Bendahara Kas Jurusan,</p>
                                    <div class="signature-line">${profile?.name || '______________________'}</div>
                                </div>
                            </div>
                            <script>window.onload = function() { setTimeout(function(){ window.print(); window.close(); }, 500); }<\/script>
                        </body>
                        </html>
                    `;
                    printWindow.document.write(html);
                    printWindow.document.close();
                };

                const handlePrintUP = () => {
                    const printWindow = window.open('', '_blank');
                    const rows = filteredUP.map((wo, idx) => `
                        <tr>
                            <td class="text-center">${idx + 1}</td>
                            <td>${new Date(wo.date).toLocaleDateString('id-ID')}</td>
                            <td>${wo.woNumber}<br><small>${wo.customerName}</small></td>
                            <td class="text-center">${wo.status}</td>
                            <td class="text-right">${formatIDR(wo.totalAmount)}</td>
                            <td class="text-right">${formatIDR(wo.paidAmount || 0)}</td>
                            <td class="text-right">${formatIDR(wo.totalAmount - (wo.paidAmount || 0))}</td>
                        </tr>
                    `).join('');

                    const html = `
                        <html>
                        <head><title>Laporan UP - ${filterMonth}</title></head>
                        <body>
                            ${printHeaderHTML}
                            <h3 style="text-align:center; margin-bottom: 20px;">LAPORAN UNIT PRODUKSI BENGKEL</h3>
                            
                            <div class="summary">
                                <div class="summary-box"><h4>TOTAL PENDAPATAN (WO)</h4><p style="color: #2563eb;">${formatIDR(totalUPRevenue)}</p></div>
                                <div class="summary-box"><h4>TOTAL DIBAYAR (KAS MASUK)</h4><p style="color: #16a34a;">${formatIDR(totalUPPaid)}</p></div>
                                <div class="summary-box"><h4>TOTAL PIUTANG</h4><p style="color: #dc2626;">${formatIDR(totalUPReceivable)}</p></div>
                            </div>

                            <table>
                                <thead><tr><th style="width:5%;">No</th><th style="width:12%;">Tanggal</th><th style="width:25%;">No WO & Pelanggan</th><th style="width:10%;">Status</th><th style="width:16%;" class="text-right">Total Tagihan</th><th style="width:16%;" class="text-right">Telah Dibayar</th><th style="width:16%;" class="text-right">Sisa Piutang</th></tr></thead>
                                <tbody>
                                    ${rows || '<tr><td colspan="7" class="text-center">Tidak ada Work Order pada bulan ini.</td></tr>'}
                                </tbody>
                            </table>

                            <div class="signature-area">
                                <div class="signature">
                                    <p>Gombong, ${new Date().toLocaleDateString('id-ID')}</p>
                                    <p>Bendahara Unit Produksi,</p>
                                    <div class="signature-line">${profile?.name || '______________________'}</div>
                                </div>
                            </div>
                            <script>window.onload = function() { setTimeout(function(){ window.print(); window.close(); }, 500); }<\/script>
                        </body>
                        </html>
                    `;
                    printWindow.document.write(html);
                    printWindow.document.close();
                };

                return (
                    <div className="space-y-6">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <h2 className="text-2xl font-bold text-slate-800">Laporan Bulanan</h2>
                            <div className="flex items-center gap-3">
                                <label className="text-sm font-semibold text-slate-600">Pilih Bulan:</label>
                                <input 
                                    type="month" 
                                    value={filterMonth}
                                    onChange={(e) => setFilterMonth(e.target.value)}
                                    className="border border-slate-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 font-medium text-slate-700"
                                />
                            </div>
                        </div>

                        {profile?.role === 'ADMIN' && (
                            <div className="flex gap-2 bg-slate-200/50 p-1.5 rounded-2xl w-fit">
                                <button onClick={()=>setTab('KAS')} className={`px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${tab==='KAS'?'bg-white shadow-sm text-blue-700':'text-slate-500 hover:text-slate-800'}`}>Kas Jurusan</button>
                                <button onClick={()=>setTab('UP')} className={`px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${tab==='UP'?'bg-white shadow-sm text-blue-700':'text-slate-500 hover:text-slate-800'}`}>Unit Produksi</button>
                            </div>
                        )}

                        {tab === 'KAS' && (profile?.role === 'ADMIN' || profile?.role === 'BENDAHARA_KAS') && (
                            <Card className="p-0 overflow-hidden border border-blue-100">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-blue-50/50">
                                    <h3 className="font-bold text-blue-900 flex items-center gap-2"><Icon name="account_balance_wallet" /> Rekap Kas Jurusan</h3>
                                    <Button onClick={handlePrintKas} variant="outline" className="!bg-white border-slate-200"><Icon name="print" size={18}/> Cetak Laporan</Button>
                                </div>
                                <div className="grid grid-cols-3 divide-x border-b border-slate-100 bg-white">
                                    <div className="p-5 text-center">
                                        <p className="text-xs font-bold text-slate-400 uppercase mb-1">Total Pemasukan</p>
                                        <p className="text-xl font-black text-green-600">{formatIDR(totalKasIn)}</p>
                                    </div>
                                    <div className="p-5 text-center">
                                        <p className="text-xs font-bold text-slate-400 uppercase mb-1">Total Pengeluaran</p>
                                        <p className="text-xl font-black text-red-600">{formatIDR(totalKasOut)}</p>
                                    </div>
                                    <div className="p-5 text-center">
                                        <p className="text-xs font-bold text-slate-400 uppercase mb-1">Net / Selisih</p>
                                        <p className="text-xl font-black text-blue-600">{formatIDR(netKas)}</p>
                                    </div>
                                </div>
                                <div className="p-6 bg-slate-50 text-center text-slate-500 text-sm">
                                    Menampilkan {filteredKas.length} data transaksi pada bulan {new Date(filterMonth + '-01').toLocaleDateString('id-ID', {month: 'long', year: 'numeric'})}. 
                                    Klik tombol Cetak untuk melihat rincian tabel.
                                </div>
                            </Card>
                        )}

                        {tab === 'UP' && (profile?.role === 'ADMIN' || profile?.role === 'BENDAHARA_UP') && (
                            <Card className="p-0 overflow-hidden border border-emerald-100">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-emerald-50/50">
                                    <h3 className="font-bold text-emerald-900 flex items-center gap-2"><Icon name="build" /> Rekap Unit Produksi</h3>
                                    <Button onClick={handlePrintUP} variant="outline" className="!bg-white border-slate-200"><Icon name="print" size={18}/> Cetak Laporan</Button>
                                </div>
                                <div className="grid grid-cols-3 divide-x border-b border-slate-100 bg-white">
                                    <div className="p-5 text-center">
                                        <p className="text-xs font-bold text-slate-400 uppercase mb-1">Total Pendapatan</p>
                                        <p className="text-xl font-black text-blue-600">{formatIDR(totalUPRevenue)}</p>
                                    </div>
                                    <div className="p-5 text-center">
                                        <p className="text-xs font-bold text-slate-400 uppercase mb-1">Telah Dibayar (Kas Masuk)</p>
                                        <p className="text-xl font-black text-green-600">{formatIDR(totalUPPaid)}</p>
                                    </div>
                                    <div className="p-5 text-center">
                                        <p className="text-xs font-bold text-slate-400 uppercase mb-1">Total Piutang</p>
                                        <p className="text-xl font-black text-red-600">{formatIDR(totalUPReceivable)}</p>
                                    </div>
                                </div>
                                <div className="p-6 bg-slate-50 text-center text-slate-500 text-sm">
                                    Menampilkan {filteredUP.length} data Work Order pada bulan {new Date(filterMonth + '-01').toLocaleDateString('id-ID', {month: 'long', year: 'numeric'})}.
                                    Klik tombol Cetak untuk melihat rincian tabel.
                                </div>
                            </Card>
                        )}
                    </div>
                );
            };

            // --- LAYOUT SETUP ---
            const NavItem = ({ id, icon, label }) => {
                const active = currentView === id;
                return (
                    <button onClick={() => { setCurrentView(id); if(window.innerWidth < 1024) setSidebarOpen(false); }}
                        className={`w-full flex items-center gap-3 px-5 py-3.5 rounded-2xl font-semibold text-sm transition-all duration-200 ${active ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}`}>
                        <Icon name={icon} size={20} className={active ? 'text-white' : 'text-slate-400'} /> {label}
                    </button>
                );
            };

            return (
                <div className="min-h-screen bg-slate-50 flex font-sans text-slate-900 overflow-hidden">
                    {/* Overlay Mobile - Diperbaiki logikanya: Muncul saat sidebar DIBUKA (isSidebarOpen), klik untuk MENUTUP */}
                    {isSidebarOpen && <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-20 lg:hidden" onClick={() => setSidebarOpen(false)}/>}

                    <aside className={`fixed lg:static inset-y-0 left-0 z-30 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 ${!isSidebarOpen ? '-translate-x-full lg:translate-x-0' : 'translate-x-0'}`}>
                        <div className="p-8 pb-4 flex justify-between items-center">
                            <div>
                                <h1 className="font-black text-2xl text-slate-800 tracking-tight">SISKEU<span className="text-blue-600">TSM</span></h1>
                                <p className="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider">SMK Negeri 1 Gombong</p>
                            </div>
                            <button className="lg:hidden p-2 bg-slate-50 rounded-full" onClick={() => setSidebarOpen(false)}><Icon name="close" size={18} /></button>
                        </div>
                        
                        <div className="p-4 flex-1 space-y-2 overflow-y-auto mt-4">
                            <NavItem id="dashboard" icon="dashboard" label="Dashboard" />
                            {(profile?.role === 'ADMIN' || profile?.role === 'BENDAHARA_KAS') && <NavItem id="kas" icon="account_balance_wallet" label="Kas Jurusan" />}
                            {(profile?.role === 'ADMIN' || profile?.role === 'BENDAHARA_UP') && <NavItem id="up" icon="build" label="Unit Produksi (UP)" />}
                            {(profile?.role === 'ADMIN' || profile?.role === 'BENDAHARA_KAS' || profile?.role === 'BENDAHARA_UP') && <NavItem id="laporan" icon="summarize" label="Laporan" />}
                        </div>

                        <div className="p-4 border-t border-slate-100">
                            <div className="p-4 bg-slate-50 rounded-2xl mb-4">
                                <p className="text-xs font-bold text-slate-400 uppercase">Login sebagai</p>
                                <p className="font-bold text-slate-800 truncate">{profile?.name}</p>
                                <p className="text-xs text-blue-600 font-bold mt-1">{profile?.role}</p>
                            </div>
                            <Button variant="outline" className="w-full !justify-start text-red-600 hover:text-red-700 hover:bg-red-50 hover:border-red-100" onClick={() => auth.signOut()}>
                                <Icon name="logout" size={18} /> Keluar Sistem
                            </Button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden relative">
                        <header className="h-20 bg-white/80 backdrop-blur-md border-b border-slate-100 flex items-center px-6 lg:px-10 z-10 lg:hidden">
                            <button className="p-2 -ml-2 bg-slate-50 rounded-full" onClick={() => setSidebarOpen(!isSidebarOpen)}><Icon name="menu" size={20} /></button>
                        </header>

                        {notification && (
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 z-50">
                                <div className={`flex items-center gap-3 px-6 py-4 rounded-2xl shadow-xl border text-sm font-bold bg-white ${notification.type === 'success' ? 'border-green-200 text-green-700' : 'border-red-200 text-red-700'}`}>
                                    <Icon name={notification.type === 'success' ? 'check_circle' : 'error'} size={20}/>
                                    {notification.msg}
                                </div>
                            </div>
                        )}

                        <div className="flex-1 overflow-auto p-6 lg:p-10">
                            <div className="max-w-6xl mx-auto">
                                {currentView === 'dashboard' && <ViewDashboard />}
                                {currentView === 'kas' && <ViewKas />}
                                {currentView === 'up' && <ViewUnitProduksi />}
                                {currentView === 'laporan' && <ViewLaporan />}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
